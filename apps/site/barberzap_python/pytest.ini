[pytest]
# Pytest configuration for BarberZap Testing Framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (individual components)
    integration: Integration tests (multiple components)
    wrapper: Tests for wrapper modules (Supabase, PostgreSQL, Evolution API, AI)
    core: Tests for core modules (Tenant Resolver, Context Builder)
    agent: Tests for agent modules (Secretaria Universal)
    crm: Tests for CRM modules (CRM Logger, CRM Manager)
    slow: Slow tests that take more time
    fast: Fast tests that should run quickly
    placeholder: Tests for placeholder wrappers (Evolution API, AI Service)
    real: Tests that require real database connections

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
# addopts = --cov=barberzap_python --cov-report=html --cov-report=term-missing

# Minimum version
minversion = 7.0

# Async support (if needed)
asyncio_mode = auto
