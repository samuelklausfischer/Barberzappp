<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - BarberZap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #09090b 0%, #18181b 50%, #09090b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .offline-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      text-align: center;
    }

    .offline-icon {
      font-size: 80px;
      margin-bottom: 24px;
    }

    .pulse {
      position: relative;
    }

    .pulse::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(244, 192, 37, 0.3);
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite;
      z-index: -1;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0;
      }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 32px;
    }

    .btn {
      background: linear-gradient(135deg, #f4c025 0%, #d9a419 100%);
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      color: #09090b;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 192, 37, 0.4);
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-text {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon pulse">📱</div>

    <h1>Offline</h1>

    <p>Você não está conectado à internet. Suas ações estão sendo salvas e serão sincronizadas quando reconectar.</p>

    <button class="btn" onclick="checkConnection()">
      Tentar Reconectar
    </button>

    <div class="info-text">
      <div style="margin-bottom: 8px;">
        <strong>Status:</strong> <span id="status">Offline</span>
      </div>
      <div>
        <strong>Última tentativa:</strong> <span id="lastTry">Agora</span>
      </div>
    </div>
  </div>

  <script>
    const status = document.getElementById('status');
    const lastTry = document.getElementById('lastTry');
    const button = document.querySelector('.btn');

    function updateStatus(isOnline) {
      if (isOnline) {
        status.textContent = 'Online! Sincronizando...';
        button.innerHTML = '<span class="spinner"></span> Conectando...';
      } else {
        status.textContent = 'Offline';
        button.innerHTML = 'Tentar Reconectar';
        button.disabled = false;
      }
    }

    function formatTime() {
      return new Date().toLocaleTimeString('pt-BR');
    }

    async function checkConnection() {
      button.disabled = true;
      updateStatus(true);
      lastTry.textContent = formatTime();

      try {
        const response = await fetch('/api/health', {
          cache: 'no-store'
        });

        if (response.ok) {
          window.location.href = '/';
        } else {
          throw new Error('Health check failed');
        }
      } catch (error) {
        console.error('Connection check failed:', error);
        updateStatus(false);
        lastTry.textContent = formatTime() + ' (Falha)';

        // Retry after connection is restored
        window.addEventListener('online', () => {
          window.location.reload();
        });
      }
    }

    // Listen for online event
    window.addEventListener('online', () => {
      updateStatus(true);
      lastTry.textContent = formatTime();
      setTimeout(() => {
        window.location.reload();
      }, 2000);
    });

    // Auto-retry every 30 seconds
    setInterval(() => {
      if (!navigator.onLine) {
        button.click();
      }
    }, 30000);

    // Initial status check
    if (navigator.onLine) {
      checkConnection();
    }
  </script>
</body>
</html>
